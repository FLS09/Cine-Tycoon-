    <script>
        // =========================================================================
        // 1. AUDIO SYNTHESIZER, STORAGE CONSTANTS & UTILITIES
        // =========================================================================
        const SAVE_KEY = 'cinetycoon_save';
        let audioCtx = null;

        function playTone(freq = 520, type = 'sine', duration = 0.08, gainVal = 0.04) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function formatIDR(num) {
            const abs = Math.abs(num);
            const sign = num < 0 ? '-' : '';
            if (abs >= 1000000000) return sign + 'Rp ' + (abs / 1000000000).toFixed(2).replace(/\.00$/, '') + ' M';
            if (abs >= 1000000) return sign + 'Rp ' + Math.round(abs / 1000000) + ' Jt';
            if (abs >= 1000) return sign + 'Rp ' + Math.round(abs / 1000) + ' Rb';
            return sign + 'Rp ' + abs;
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showToast(msg, type = 'info') {
            const box = document.getElementById('toastContainer');
            if (!box) return;
            const styles = {
                info: 'bg-[#151b2b]/95 border-white/15 text-white',
                success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
                warn: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
                error: 'bg-rose-950/95 border-rose-500/40 text-rose-200'
            };
            const el = document.createElement('div');
            el.className = 'px-3.5 py-2.5 rounded-2xl border shadow-2xl backdrop-blur-md text-xs font-semibold flex items-center gap-2 animate-modal-spring ' + (styles[type] || styles.info);
            el.innerHTML = '<i class="ph-fill ph-sparkle text-amber-400 shrink-0"></i><span class="leading-snug">' + msg + '</span>';
            box.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-6px)';
                el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
                setTimeout(() => el.remove(), 260);
            }, 3200);
        }

        let state = createDefaultState();

        function saveGameState(silent = true) {
            try {
                state.lastSavedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                const icon = document.getElementById('hudSaveIcon');
                if (icon) {
                    icon.classList.remove('text-gray-400');
                    icon.classList.add('text-emerald-400');
                }
                if (!silent) showToast('Progres permainan berhasil disimpan ke LocalStorage!', 'success');
            } catch (e) {
                if (!silent) showToast('Gagal menyimpan ke LocalStorage browser.', 'error');
            }
        }

        function loadGameState() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return false;
                const def = createDefaultState();
                state = {
                    ...def,
                    ...parsed,
                    draft: { ...def.draft, ...(parsed.draft || {}) },
                    cinemail: { ...def.cinemail, ...(parsed.cinemail || {}) },
                    cinegram: { ...def.cinegram, ...(parsed.cinegram || {}) },
                    boxoffice: { ...def.boxoffice, ...(parsed.boxoffice || {}) },
                    cineflix: { ...def.cineflix, ...(parsed.cineflix || {}) },
                    cineboxd: { ...def.cineboxd, ...(parsed.cineboxd || {}) }
                };
                return true;
            } catch (e) {
                return false;
            }
        }

        // =========================================================================
        // 4. CORE NAVIGATION, HUD & SYSTEM MODALS
        // =========================================================================
        function updateHUD() {
            const nameEl = document.getElementById('hudStudioName');
            if (nameEl) nameEl.textContent = state.studioName;

            const awardEl = document.getElementById('hudAwardCount');
            if (awardEl) awardEl.textContent = state.awards.length;

            const cashEl = document.getElementById('hudCash');
            if (cashEl) {
                cashEl.textContent = formatIDR(state.cash);
                cashEl.className = 'font-mono font-extrabold text-[11px] sm:text-xs leading-tight ' + (state.cash < 0 ? 'text-rose-400' : 'text-emerald-300');
            }

            const wyEl = document.getElementById('hudWeekYear');
            if (wyEl) wyEl.textContent = 'Pekan ' + state.week + ' • ' + state.year;

            const trEl = document.getElementById('hudTrend');
            if (trEl) trEl.textContent = 'Tren: ' + state.trendingGenre + ' (+25%)';

            const repEl = document.getElementById('hudRep');
            if (repEl) repEl.textContent = state.reputation + '%';

            const hypeEl = document.getElementById('hudHype');
            if (hypeEl) hypeEl.textContent = state.hype + '%';

            const unreadMailCount = state.cinemail.messages.filter(m => m.unread).length;
            const mailBadge = document.getElementById('badge-cinemail');
            if (mailBadge) {
                if (unreadMailCount > 0) {
                    mailBadge.textContent = unreadMailCount;
                    mailBadge.classList.remove('hidden');
                } else {
                    mailBadge.classList.add('hidden');
                }
            }

            const gramBadge = document.getElementById('badge-cinegram');
            if (gramBadge) {
                if (state.cinegram.unreadNotif) gramBadge.classList.remove('hidden');
                else gramBadge.classList.add('hidden');
            }
        }

        function triggerWorkspaceTransition() {
            const main = document.getElementById('mainWorkspace');
            if (!main) return;
            main.classList.remove('animate-tab-glide');
            void main.offsetWidth;
            main.classList.add('animate-tab-glide');
        }

        function switchMainTab(tabId) {
            const changed = state.mainTab !== tabId;
            state.mainTab = tabId;
            if (tabId === 'cinegram') {
                state.cinegram.unreadNotif = false;
                updateHUD();
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-amber-400', 'bg-amber-500/15');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById('nav-' + tabId);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-amber-400', 'bg-amber-500/15');
            }
            if (changed) triggerWorkspaceTransition();
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const tab = state.mainTab;
            if (tab === 'studio') renderStudioView();
            else if (tab === 'cinemail') renderCinemailView();
            else if (tab === 'cinegram') renderCinegramView();
            else if (tab === 'boxoffice') renderBoxOfficeView();
            else if (tab === 'cineflix') renderCineflixView();
            else if (tab === 'cineboxd') renderCineboxdView();
        }

        function openModal(html, maxWidthClass = 'max-w-2xl') {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            if (!overlay || !content) return;
            content.className = 'w-full ' + maxWidthClass + ' bg-[#111520] border border-white/10 rounded-3xl shadow-2xl overflow-hidden animate-modal-spring';
            content.innerHTML = html;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            if (!overlay) return;
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function getWeeklyPayroll() {
            return state.hiredCrewIds.reduce((sum, id) => {
                const c = CREW_CATALOG.find(x => x.id === id);
                return sum + (c ? c.weeklySalary : 0);
            }, 0);
        }

        function calcEstimatedProductionBudget() {
            const d = state.draft;
            const loc = LOCATIONS.find(l => l.id === d.locationId) || LOCATIONS[0];
            const formatBase = d.format === 'Series' ? 95000000 : d.format === 'Film Pendek' ? 30000000 : 70000000;
            const styleMult = d.visualStyle === 'Animasi 3D' ? 1.35 : d.visualStyle === 'Animasi 2D' ? 1.15 : 1.0;
            const scale = d.scaleMult || 1.0;
            return Math.round((formatBase * styleMult + loc.cost) * scale);
        }

        function calcDraftPreviewStats() {
            const d = state.draft;
            const loc = LOCATIONS.find(l => l.id === d.locationId) || LOCATIONS[0];
            const slots = [d.directorId, d.actorId, d.writerId, d.techId].filter(Boolean);

            let skillSum = 0;
            let specialtyMatches = 0;
            slots.forEach(cid => {
                const c = CREW_CATALOG.find(x => x.id === cid);
                if (c) {
                    skillSum += c.skill;
                    if (c.specialty === d.genre) specialtyMatches += 1;
                }
            });

            const avgSkill = slots.length > 0 ? skillSum / slots.length : 60;
            const budget = calcEstimatedProductionBudget();
            const budgetBoost = Math.min(18, Math.round(budget / 25000000));
            const estQuality = Math.min(88, Math.max(28, Math.round(avgSkill * 0.45 + loc.qBonus + specialtyMatches * 4 + budgetBoost)));
            const estHype = Math.min(85, Math.max(15, Math.round(state.hype * 0.45 + loc.hypeBonus + d.mktPct * 0.45 + specialtyMatches * 3 + (d.franchiseId ? 12 : 0))));

            return { loc, estQuality, estHype, specialtyMatches, budget };
        }

        function startProduction() {
            const d = state.draft;
            if (!d.title.trim()) return showToast('Masukkan judul proyek terlebih dahulu!', 'warn');

            const slotIds = [d.directorId, d.actorId, d.writerId, d.techId].filter(Boolean);
            let extraSignFees = 0;
            slotIds.forEach(cid => {
                if (!state.hiredCrewIds.includes(cid)) {
                    const c = CREW_CATALOG.find(x => x.id === cid);
                    if (c) extraSignFees += c.signFee;
                }
            });

            const baseBudget = calcEstimatedProductionBudget();
            const totalInitialCost = baseBudget + extraSignFees;
            if (state.cash < totalInitialCost) {
                return showToast('Kas studio tidak cukup! Butuh ' + formatIDR(totalInitialCost) + ' (termasuk kontrak kru).', 'error');
            }

            state.cash -= totalInitialCost;
            slotIds.forEach(cid => {

            });

            const preview = calcDraftPreviewStats();
            const validFranchise = d.franchiseId ? state.franchises.find(x => x.id === d.franchiseId) : null;

        function triggerCameraTake() {
            const p = state.activeProduction;
            const cursor = document.getElementById('focusCursor');
            if (!p || !cursor) return;
            if (p.takesLeftThisWeek <= 0) {
                return showToast('Jatah 2x Take kamera pekan ini sudah habis! Klik Pekan +1 untuk melanjutkan syuting.', 'warn');
            }

            p.takesLeftThisWeek -= 1;
            const parentRect = cursor.parentElement.getBoundingClientRect();
            const cursorRect = cursor.getBoundingClientRect();
            const pct = ((cursorRect.left - parentRect.left) / parentRect.width) * 100;

            const isPerfect = pct >= 35 && pct <= 63;
            if (isPerfect) {
                p.takeStreak += 1;
                const qGain = Math.min(4, 1 + p.takeStreak);
                p.quality = Math.min(100, p.quality + qGain);
                p.progress = Math.min(100, p.progress + 18);
                playTone(760, 'triangle', 0.11, 0.05);
                showToast('PERFECT TAKE! Streak ' + p.takeStreak + 'x (+' + qGain + ' Kualitas, +18% Progres)!', 'success');
            } else {
                p.takeStreak = 0;
                p.quality = Math.min(100, p.quality + 1);
                p.progress = Math.min(100, p.progress + 10);

        function runOnSetAction(type) {
            const p = state.activeProduction;
            if (!p) return;
            if (type === 'promo') {
                if (state.cash < 25000000) return showToast('Kas tidak cukup (butuh Rp 25 Jt)!', 'error');
                state.cash -= 25000000;
                p.budget += 25000000;
                p.hype = Math.min(100, p.hype + 9);
                showToast('Teaser dirilis! Hype proyek naik +9%.', 'success');
            } else if (type === 'reshoot') {
                if (state.cash < 35000000) return showToast('Kas tidak cukup (butuh Rp 35 Jt)!', 'error');
                state.cash -= 35000000;
                p.budget += 35000000;
                p.quality = Math.min(100, p.quality + 7);
                showToast('Reshoot selesai! Kualitas produksi naik +7.', 'success');
            } else if (type === 'dolby') {
                if (p.audioPolished) return;
                if (state.cash < 20000000) return showToast('Kas tidak cukup (butuh Rp 20 Jt)!', 'error');
                state.cash -= 20000000;
                p.budget += 20000000;
                p.audioPolished = true;
                p.quality = Math.min(100, p.quality + 5);
                p.hype = Math.min(100, p.hype + 3);
                showToast('Tata suara Dolby Atmos & Color Grading selesai! (+5 Kualitas, +3 Hype)', 'success');
            }
            saveGameState(true);
            updateHUD();
            renderActiveProduction();
        }

        function submitToFestival(tierIdx) {
            const p = state.activeProduction;
            if (!p) return;
            const tiers = FESTIVAL_TIERS_BY_FORMAT[p.format] || FESTIVAL_TIERS_BY_FORMAT['Film Panjang'];
            const tier = tiers[tierIdx];
            if (!tier) return;
            if (state.cash < tier.fee) return showToast('Kas tidak cukup untuk biaya pendaftaran festival!', 'error');
            state.cash -= tier.fee;

            const cutBonus = p.editingCut === 'festival' ? 6 : 0;
            const effectiveQ = p.quality + cutBonus + (Math.random() * 10 - 4);
            const won = effectiveQ >= tier.minQ;

            closeModal();
            releaseActiveProduction('festival', { won, tier });
        }

        function releaseActiveProduction(channel, festResult = null) {
            const p = state.activeProduction;
            if (!p || p.progress < 100) return;

            const trendBonus = p.genre === state.trendingGenre ? 0.25 : 0;
            const cutRatingBonus = p.editingCut === 'directors' ? 0.2 : p.editingCut === 'festival' ? 0.15 : 0;
            const rawStars = 1.4 + (p.quality / 100) * 3.1 + trendBonus + cutRatingBonus + (festResult?.won ? 0.25 : 0);
            const finalRating = Math.min(5.0, Math.max(1.2, Number(rawStars.toFixed(1))));

            const dirObj = CREW_CATALOG.find(c => c.id === p.directorId);
            const directorName = dirObj ? dirObj.name : state.studioName;

            const genreVisuals = {
                Horor: { icon: 'ph-skull', grad: 'from-red-950 via-stone-950 to-black' },
                Aksi: { icon: 'ph-fire', grad: 'from-orange-950 via-zinc-950 to-black' },
                Drama: { icon: 'ph-masks-theater', grad: 'from-amber-950 via-stone-950 to-black' },
                Komedi: { icon: 'ph-smiley', grad: 'from-yellow-900 via-amber-950 to-black' },
                'Sci-Fi': { icon: 'ph-planet', grad: 'from-cyan-950 via-slate-950 to-black' },
                Thriller: { icon: 'ph-detective', grad: 'from-indigo-950 via-zinc-950 to-black' },
                Romansa: { icon: 'ph-heart', grad: 'from-rose-950 via-indigo-950 to-black' },
                Fantasi: { icon: 'ph-sparkle', grad: 'from-teal-950 via-emerald-950 to-black' }
            };
            const vis = genreVisuals[p.genre] || genreVisuals['Drama'];

            const isTheater = channel === 'theater' && p.format === 'Film Panjang';
            const theaterHype = Math.min(100, p.hype + (p.editingCut === 'theatrical' ? 6 : 0));
            const maxTheaterWeeks = isTheater ? Math.max(2, Math.min(10, Math.round(theaterHype / 10))) : 0;

            const initialScreens = isTheater
                ? Math.max(120, Math.min(950, Math.round((theaterHype * 5.2 + state.reputation * 3.1))))
                : 0;
            const openingGross = isTheater
                ? Math.round(initialScreens * (110000 + finalRating * 42000) * state.marketMood.mult)
                : 0;
            const studioOpeningShare = Math.round(openingGross * 0.5);
            if (isTheater) state.cash += studioOpeningShare;

            const newMovie = {
                id: 'mov_' + Date.now(),
                title: p.title,
                studio: state.studioName,
                director: directorName,
                genre: p.genre,
                format: p.format,
                year: state.year,
                rating: finalRating,
                franchiseId: p.franchiseId || '',
                inTheater: isTheater,
                theaterWeek: isTheater ? 1 : 0,
                maxTheaterWeeks,
                releaseHype: theaterHype,
                postTheaterReady: false,
                weeklyGross: openingGross,
                totalGross: openingGross,
                screens: initialScreens,
                icon: vis.icon,
                grad: vis.grad,
                synopsis: p.synopsis,
                reviews: generateReleaseReviews(p.title, p.genre, finalRating)
            };

            state.releasedMovies.unshift(newMovie);

            if (!isTheater) {
                if (!state.cineflix.licensedMovieIds.includes(newMovie.id)) {
                    state.cineflix.licensedMovieIds.unshift(newMovie.id);
                    state.cineflix.weeksSinceNewCatalog = 0;
                }
                const tierCaps = { 1: 25000, 2: 80000, 3: 250000 };
                const cap = tierCaps[state.cineflix.tier] || 25000;
                const subGain = Math.round((finalRating * 950 + p.hype * 45) * (p.format === 'Series' ? 1.35 : 1.0));
                state.cineflix.subscribers = Math.min(cap, state.cineflix.subscribers + subGain);
            }

            const matchedFranchise = p.franchiseId ? state.franchises.find(x => x.id === p.franchiseId) : null;
            if (matchedFranchise) {
                matchedFranchise.entries += 1;
                matchedFranchise.bestRating = Math.max(matchedFranchise.bestRating, finalRating);
            } else if (finalRating >= 3.8) {
                const newIpId = 'ip_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                newMovie.franchiseId = newIpId;
                state.franchises.unshift({
                    id: newIpId,
                    name: p.title,
                    genre: p.genre,
                    entries: 1,
                    bestRating: finalRating
                });
            }

            state.draft.franchiseId = '';
            state.draft.title = RANDOM_TITLES[Math.floor(Math.random() * RANDOM_TITLES.length)];

            state.cinegram.posts.unshift({
                id: 'post_rel_' + Date.now(),
                region: 'id',
                author: 'cinephile_jakarta',
                verified: true,
                following: true,
                location: isTheater ? 'Jaringan Bioskop Nasional' : 'CineFlix+ Original Premiere',
                time: 'Baru saja',
                headline: (isTheater ? 'TAYANG PERDANA: ' : 'PREMIERE STREAMING: ') + p.title,
                grad: vis.grad,
                icon: vis.icon,
                movieId: newMovie.id,
                caption: state.studioName + ' resmi merilis ' + p.format + ' "' + p.title + '" (' + finalRating.toFixed(1) + '★)! ' + (isTheater ? 'Dijadwalkan tayang ' + maxTheaterWeeks + ' pekan di bioskop sesuai antusiasme penonton! 🎟️🍿' : 'Kini eksklusif tayang di CineFlix+! 📺🔥') + ' #FilmIndonesia',
                translatedCaption: null,
                likes: Math.round(1400 + finalRating * 750),
                liked: false,
                bookmarked: false,
                poll: null,
                comments: [
                    { id: 'cr1_' + Date.now(), user: 'nadia_sinefil', text: finalRating >= 3.8 ? 'Baru kelar nonton dan gila sih eksekusinya rapi banget!! 🔥👏' : 'Premisnya unik sih, lumayan buat tontonan akhir pekan.', time: '1m', likes: 94, liked: false },
                    { id: 'cr2_' + Date.now(), user: 'dimas.projector', text: 'Arahan ' + directorName + ' kerasa banget ciri khasnya di sini.', time: '1m', likes: 62, liked: false },
                    { id: 'cr3_' + Date.now(), user: 'tukang_popcorn', text: '@rara.movietalk gas nonton ini malem ini!', time: '1m', likes: 38, liked: false }
                ],
                hiddenComments: []
            });
            state.cinegram.unreadNotif = true;

            if (finalRating <= 2.5) {
                state.crisisMovieId = newMovie.id;
            } else if (finalRating >= 3.7 && (!isTheater || openingGross < 180000000 || state.cash < 250000000)) {
                generateSmartFundingMail(newMovie);
            }

            state.activeProduction = null;
            saveGameState(true);
            updateHUD();
            renderStudioView();

            if (festResult) {
                if (festResult.won) {
                    triggerAwardWin({
                        festival: festResult.tier.name,
                        category: festResult.tier.cat,
                        movieTitle: p.title,
                        prizeCash: festResult.tier.prize,
                        repGain: festResult.tier.rep
                    });
                } else {
                    showToast('"' + p.title + '" tampil di ' + festResult.tier.name + ' (belum menang piala) & masuk ke CineFlix+.', 'info');
                }
            } else if (isTheater) {
                showToast('"' + p.title + '" rilis di bioskop (' + maxTheaterWeeks + ' mgg)! Bagian pembuka: +' + formatIDR(studioOpeningShare), 'success');
            } else {
                showToast('"' + p.title + '" tayang eksklusif di CineFlix+ (' + finalRating.toFixed(1) + '★)!', 'success');
            }
        }

        function getSenderAvatarStyle(sender) {
            const palettes = [
                'from-rose-500 to-pink-600',
                'from-sky-500 to-indigo-600',
                'from-amber-500 to-orange-600',
                'from-emerald-500 to-teal-600',
                'from-purple-500 to-fuchsia-600'
            ];
            let hash = 0;
            for (let i = 0; i < sender.length; i++) hash = sender.charCodeAt(i) + ((hash << 5) - hash);
            const grad = palettes[Math.abs(hash) % palettes.length];
            const initials = sender.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'CM';
            return { grad, initials };
        }

        function openCinemailThread(mailId) {
            state.cinemail.selectedId = mailId;
            state.cinemail.mobilePane = 'detail';
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (m && m.unread) {
                m.unread = false;
                updateHUD();
            }
            renderCinemailView();
        }

        function markAllMailsRead() {
            state.cinemail.messages.forEach(m => m.unread = false);
            updateHUD();
            renderCinemailView();
            showToast('Semua pesan ditandai sudah dibaca.', 'info');
        }

        function deleteCinemailThread(mailId) {
            state.cinemail.messages = state.cinemail.messages.filter(m => m.id !== mailId);
            state.cinemail.mobilePane = 'list';
            saveGameState(true);
            updateHUD();
            renderCinemailView();
            showToast('Pesan dihapus dari kotak masuk.', 'info');
        }

        function toggleMailStar(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (m) {
                m.starred = !m.starred;
                renderCinemailView();
            }
        }

        function negotiateLicenseMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.negotiated) return;
            m.negotiated = true;
            if (Math.random() < 0.72) {
                m.price = Math.round(m.price * 0.85);
                showToast('Negosiasi berhasil! Harga lisensi turun 15% menjadi ' + formatIDR(m.price) + '.', 'success');
            } else {
                showToast('Studio pemilik hak cipta menolak diskon dan bertahan di harga awal.', 'warn');
            }
            saveGameState(true);
            renderCinemailView();
        }

        function acceptLicenseMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            if (state.cash < m.price) return showToast('Kas studio tidak cukup untuk membeli lisensi ini!', 'error');

            state.cash -= m.price;
            m.resolved = true;
            if (!state.cineflix.licensedMovieIds.includes(m.movieId)) {
                state.cineflix.licensedMovieIds.unshift(m.movieId);
                state.cineflix.weeksSinceNewCatalog = 0;
            }
            const tierCaps = { 1: 25000, 2: 80000, 3: 250000 };
            const cap = tierCaps[state.cineflix.tier] || 25000;
            state.cineflix.subscribers = Math.min(cap, state.cineflix.subscribers + m.subBoost);

            saveGameState(true);
            playTone(640, 'triangle', 0.12, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Lisensi resmi aktif di CineFlix+! Pelanggan bertambah.', 'success');
        }

        function acceptSponsorMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.payout;
            m.resolved = true;
            saveGameState(true);
            playTone(680, 'triangle', 0.1, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Dana sponsor +' + formatIDR(m.payout) + ' masuk ke kas studio!', 'success');
        }

        function acceptLoanMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.principal;
            m.resolved = true;
            state.activeLoans.push({
                id: 'loan_' + Date.now(),
                lender: m.sender,
                principal: m.principal,
                weeklyPayment: m.weeklyPayment,
                weeksLeft: m.durationWeeks
            });
            saveGameState(true);
            playTone(620, 'triangle', 0.12, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Pinjaman +' + formatIDR(m.principal) + ' cair! Cicilan ' + formatIDR(m.weeklyPayment) + '/mgg.', 'success');
        }

        function acceptCoProdMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.payout;
            state.reputation = Math.min(100, state.reputation + (m.repGain || 3));
            m.resolved = true;
            saveGameState(true);
            playTone(720, 'triangle', 0.14, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Investasi Co-Production +' + formatIDR(m.payout) + ' & +' + (m.repGain || 3) + '% Reputasi diterima!', 'success');
        }

        function repayLoanEarly(loanId) {
            const idx = state.activeLoans.findIndex(l => l.id === loanId);
            if (idx === -1) return;
            const loan = state.activeLoans[idx];
            const payoff = loan.weeklyPayment * loan.weeksLeft;
            if (state.cash < payoff) return showToast('Kas studio tidak cukup untuk pelunasan (' + formatIDR(payoff) + ')!', 'error');
            state.cash -= payoff;
            state.activeLoans.splice(idx, 1);
            saveGameState(true);
            playTone(740, 'triangle', 0.12, 0.05);
            updateHUD();
            openFundingPitchModal();
            showToast('Pinjaman dari ' + loan.lender + ' berhasil dilunasi!', 'success');
        }

        function generateSmartFundingMail(acclaimedMovie = null) {
            const unresolvedFunding = state.cinemail.messages.filter(m => !m.resolved && ['sponsorship', 'investor_loan', 'coproduction_invest'].includes(m.actionType)).length;
            if (!acclaimedMovie && unresolvedFunding >= 4) return;

            if (acclaimedMovie) {
                const partners = [
                    { name: 'CJ ENM Southeast Asia', email: 'acquisitions@cjenm-asia.com' },
                    { name: 'A24 World Acquisitions', email: 'international@a24films.com' },
                    { name: 'Visinema Capital Partners', email: 'invest@visinemacapital.id' },
                    { name: 'Falcon Global Co-Production', email: 'copro@falconpictures.co.id' }
                ];
                const partner = partners[Math.floor(Math.random() * partners.length)];
                const grant = Math.round(110000000 + acclaimedMovie.rating * 35000000);
                state.cinemail.messages.unshift({
                    id: 'mail_copro_' + Date.now() + '_' + Math.floor(Math.random() * 999),
                    folder: 'business',
                    sender: partner.name,
                    email: partner.email,
                    subject: 'Investasi Co-Production untuk Kualitas "' + acclaimedMovie.title + '" (' + acclaimedMovie.rating.toFixed(1) + '★)',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: true,
                    body: 'Halo Tim ' + state.studioName + ',\n\nKami sangat terkesan dengan kualitas artistik karya Anda "' + acclaimedMovie.title + '" yang meraih skor tinggi ' + acclaimedMovie.rating.toFixed(1) + '★ meskipun pendapatan komersialnya masih bertumbuh.\n\nSebagai bentuk dukungan terhadap talenta sinema berkualitas, kami mengajukan investasi co-production & hak distribusi internasional senilai ' + formatIDR(grant) + ' agar studio Anda dapat terus memproduksi karya besar berikutnya.',
                    actionType: 'coproduction_invest',
                    payout: grant,
                    repGain: 4,
                    resolved: false
                });
                return;
            }

            if (state.cash < 180000000) {
                const principal = 250000000;
                const weekly = 27500000;
                state.cinemail.messages.unshift({
                    id: 'mail_loan_' + Date.now() + '_' + Math.floor(Math.random() * 999),
                    folder: 'business',
                    sender: 'Garuda Film Capital (VC)',
                    email: 'credit@garudafilmvc.id',
                    subject: 'Pinjaman Darurat Modal Produksi (' + formatIDR(principal) + ')',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: false,
                    body: 'Halo Pimpinan ' + state.studioName + ',\n\nKami memantau arus kas studio Anda sedang ketat. Kami menawarkan pinjaman modal kerja sebesar ' + formatIDR(principal) + ' agar jadwal syuting dan gaji kru Anda tetap aman, dengan cicilan ' + formatIDR(weekly) + '/pekan selama 10 pekan.',
                    actionType: 'investor_loan',
                    principal,
                    weeklyPayment: weekly,
                    durationWeeks: 10,
                    resolved: false
                });
            } else {
                const sponsors = [
                    { name: 'Teh Botol Nusantara', email: 'promo@tehbotolnusantara.id', payout: 35000000 },
                    { name: 'Indomie Rasa Sinema', email: 'brand@indomie-creative.id', payout: 50000000 },
                    { name: 'GoPay Entertainment', email: 'partners@gopay-ent.id', payout: 65000000 }
                ];
                const sp = sponsors[Math.floor(Math.random() * sponsors.length)];
                state.cinemail.messages.unshift({
                    id: 'mail_sp_' + Date.now() + '_' + Math.floor(Math.random() * 999),
                    folder: 'business',
                    sender: sp.name,
                    email: sp.email,
                    subject: 'Kontrak Sponsor Brand Komersial (+' + formatIDR(sp.payout) + ')',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: false,
                    body: 'Halo Tim ' + state.studioName + ',\n\nKami ingin berkolaborasi dalam kampanye promosi dan penempatan produk pada proyek studio Anda pekan ini dengan pencairan dana sponsor sebesar ' + formatIDR(sp.payout) + '.',
                    actionType: 'sponsorship',
                    payout: sp.payout,
                    resolved: false
                });
            }
        }

        function requestFundingOffer(kind) {
            if (kind === 'copro') {
                const best = state.releasedMovies
                    .filter(m => m.studio === state.studioName && m.rating >= 3.6)
                    .sort((a, b) => b.rating - a.rating)[0];
                if (!best) {
                    return showToast('Rilis minimal 1 karya studio dengan skor ≥ 3.6★ terlebih dahulu untuk pitching ke perusahaan film!', 'warn');
                }
                generateSmartFundingMail(best);
            } else if (kind === 'loan') {
                const principal = state.reputation >= 50 ? 400000000 : 220000000;
                const weekly = Math.round((principal * 1.1) / 10);
                state.cinemail.messages.unshift({
                    id: 'mail_req_ln_' + Date.now(),
                    folder: 'business',
                    sender: 'Nusantara Film Venture (VC)',
                    email: 'approval@nusantaravc.id',
                    subject: 'Persetujuan Pinjaman Modal Studio (' + formatIDR(principal) + ')',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: true,
                    body: 'Halo ' + state.studioName + ',\n\nPengajuan pinjaman modal kerja Anda telah disetujui! Dana sebesar ' + formatIDR(principal) + ' siap ditransfer dengan cicilan ' + formatIDR(weekly) + '/pekan selama 10 pekan.',
                    actionType: 'investor_loan',
                    principal,
                    weeklyPayment: weekly,
                    durationWeeks: 10,
                    resolved: false
                });
            } else {
                const payout = Math.round(35000000 + state.reputation * 600000);
                state.cinemail.messages.unshift({
                    id: 'mail_req_sp_' + Date.now(),
                    folder: 'business',
                    sender: 'Kopi Kenangan & Mitra Brand',
                    email: 'agency@brandmitra.id',
                    subject: 'Kontrak Sponsor Brand Baru (+' + formatIDR(payout) + ')',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: false,
                    body: 'Halo Tim ' + state.studioName + ',\n\nKami siap menjadi sponsor produk pada produksi Anda berikutnya dengan pencairan dana langsung sebesar ' + formatIDR(payout) + '.',
                    actionType: 'sponsorship',
                    payout,
                    resolved: false

        function publishStudioSocialPost(kind) {
            const cost = kind === 'giveaway' ? 20000000 : kind === 'poster' ? 10000000 : 0;
            if (state.cash < cost) return showToast('Kas studio tidak cukup (' + formatIDR(cost) + ')!', 'error');
            state.cash -= cost;
            const hypeGain = kind === 'giveaway' ? 12 : kind === 'poster' ? 7 : 3;
            state.hype = Math.min(100, state.hype + hypeGain);
            if (kind === 'giveaway') state.reputation = Math.min(100, state.reputation + 2);

            const studioHandle = state.studioName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const subj = state.activeProduction ? state.activeProduction.title : ('Proyek ' + state.draft.genre + ' ' + state.year);
            const headlines = {
                bts: 'BEHIND THE SCENES: ' + subj,
                poster: 'OFFICIAL FIRST LOOK: ' + subj,
                giveaway: 'GIVEAWAY TIKET NOBAR ' + state.studioName.toUpperCase() + '!'
            };
            const captions = {
                bts: 'Intip keseruan kru dan pemain di balik layar produksi "' + subj + '" pekan ini! Siapa yang paling kalian tunggu aktingnya? 🎥✨ #BehindTheScenes #' + state.studioName.replace(/\s+/g, ''),
                poster: 'Resmi dirilis! Inilah tampilan perdana "' + subj + '" persembahan ' + state.studioName + '. Siapkan jadwal nonton kalian! 🔥🎬 #FirstLook #FilmIndonesia',
                giveaway: 'Kabar gembira buat para sinefil! ' + state.studioName + ' bagi-bagi tiket nonton bareng spesial. Tag 2 teman nonton kalian di kolom komentar! 🍿🎟️'
            };

            state.cinegram.posts.unshift({
                id: 'post_st_' + Date.now(),
                region: 'id',
                author: studioHandle,
                verified: true,
                following: true,
                location: 'Studio ' + state.studioName,
                time: 'Baru saja',
                headline: headlines[kind],
                grad: 'from-amber-900 via-stone-900 to-black',
                icon: 'ph-film-slate',
                movieId: null,
                caption: captions[kind],
                translatedCaption: null,
                likes: Math.round(900 + hypeGain * 180),
                liked: true,
                bookmarked: false,
                poll: null,
                comments: [
                    { id: 'cst1', user: 'nadia_sinefil', text: 'Gak sabar banget nunggu rilisnya min!! 🔥🙌', time: '1m', likes: 45, liked: false },
                    { id: 'cst2', user: 'rara.movietalk', text: '@bagas_pratama ikutan yuk siapa tau menang tiket gratis!', time: '1m', likes: 28, liked: false },
                    { id: 'cst3', user: 'cinephile_jakarta', text: 'Visual dan atmosfernya kelihatan niat banget 👏', time: '1m', likes: 39, liked: false }
                ],
                hiddenComments: []
            });

            saveGameState(true);
            closeModal();
            updateHUD();
            renderCinegramView();
            showToast('Postingan studio diunggah ke CineGram! (+' + hypeGain + '% Hype)', 'success');
        }

        function preserveCinegramScroll(fn) {
            const scroller = document.getElementById('cinegramFeedScroll');
            const top = scroller ? scroller.scrollTop : 0;
            fn();
            const nextScroller = document.getElementById('cinegramFeedScroll');
            if (nextScroller) {
                nextScroller.style.scrollBehavior = 'auto';
                nextScroller.scrollTop = top;
                nextScroller.style.scrollBehavior = '';
            }
        }

        function togglePostLike(postId) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (!post) return;
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                playTone(post.liked ? 640 : 420, 'sine', 0.06, 0.03);
                renderCinegramView();
            });
        }

        function doubleTapPost(postId) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (!post) return;
                if (!post.liked) {
                    post.liked = true;
                    post.likes += 1;
                }
                renderCinegramView();
                const burst = document.getElementById('heartBurst-' + postId);
                if (burst) {
                    burst.classList.remove('hidden');
                    setTimeout(() => burst.classList.add('hidden'), 650);
                }
            });
        }

        function togglePostBookmark(postId) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (post) {
                    post.bookmarked = !post.bookmarked;
                    renderCinegramView();
                }
            });
        }

        function togglePostTranslation(postId) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (post) {
                    post.showTranslation = !post.showTranslation;
                    renderCinegramView();
                }
            });
        }

        function toggleFollowAuthor(postId) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (post) {
                    post.following = !post.following;
                    renderCinegramView();
                }
            });
        }

        function voteCinegramPoll(postId, optIdx) {
            preserveCinegramScroll(() => {
                const post = state.cinegram.posts.find(p => p.id === postId);
                if (!post || !post.poll || post.poll.votedIndex !== null) return;
                post.poll.votedIndex = optIdx;
                post.poll.options[optIdx].votes += 1;
                playTone(580, 'triangle', 0.08, 0.03);
                renderCinegramView();
            });
        }

        function calcCineflixWeeklyEconomics() {
            const cf = state.cineflix;
            const tierCfg = CINEFLIX_TIERS[cf.tier] || CINEFLIX_TIERS[1];
            const catalog = state.releasedMovies.filter(m => cf.licensedMovieIds.includes(m.id));
            if (catalog.length === 0 || cf.subscribers <= 0) {
                return { catalog, tierCfg, grossWeekly: 0, platformFee: 0, serverCost: 0, netWeekly: 0, avgRating: 0 };
            }
            const avgRating = catalog.reduce((s, m) => s + m.rating, 0) / catalog.length;
            const grossWeekly = Math.round((cf.subscribers * cf.monthlyPrice) / 4);
            const platformFee = Math.round(grossWeekly * 0.15);
            const serverCost = Math.round(cf.subscribers * tierCfg.serverCostPerSub);
            const netWeekly = grossWeekly - platformFee - serverCost;
            return { catalog, tierCfg, grossWeekly, platformFee, serverCost, netWeekly, avgRating };
        }

        function upgradeCineflixTier() {
            const cf = state.cineflix;
            if (cf.tier >= 3) return;
            const cfg = CINEFLIX_TIERS[cf.tier];
            const nextCfg = CINEFLIX_TIERS[cf.tier + 1];
            const econ = calcCineflixWeeklyEconomics();

            if (econ.catalog.length < cfg.nextReqTitles || econ.avgRating < cfg.nextReqRating || state.reputation < cfg.nextReqRep) {
                return showToast('Syarat katalog atau reputasi belum terpenuhi!', 'warn');
            }
            if (state.cash < cfg.nextCost) {
                return showToast('Kas studio tidak cukup untuk upgrade server!', 'error');
            }

            state.cash -= cfg.nextCost;
            cf.tier += 1;
            cf.monthlyPrice = Math.max(nextCfg.minPrice, Math.min(nextCfg.maxPrice, cf.monthlyPrice + 15000));
            saveGameState(true);
            playTone(720, 'triangle', 0.14, 0.05);
            updateHUD();
            renderCineflixView();
            showToast('CineFlix+ berhasil di-upgrade ke ' + nextCfg.name + '!', 'success');
        }

        function buildRatingHistogram(movie) {
            const centerBin = Math.max(0, Math.min(9, Math.round(movie.rating * 2) - 1));
            const bins = [];
            for (let i = 0; i < 10; i++) {
                const dist = Math.abs(i - centerBin);
                const base = dist === 0 ? 100 : dist === 1 ? 64 : dist === 2 ? 32 : dist === 3 ? 14 : 5;
                bins.push(base);
            }
            (movie.reviews || []).forEach(r => {
                const idx = Math.max(0, Math.min(9, Math.round(r.rating * 2) - 1));
                bins[idx] += 18;
            });
            const maxVal = Math.max(...bins, 1);
            return bins.map(v => Math.max(10, Math.round((v / maxVal) * 100)));
        }

        // =========================================================================
        // 11. WEEKLY SIMULATION ENGINE (PEKAN +1 + AUTO-SAVE TO LOCALSTORAGE)
        // =========================================================================
        function advanceWeek() {
            state.week += 1;
            if (state.week > 52) {
                state.week = 1;
                state.year += 1;
            }

            const payroll = getWeeklyPayroll();
            const studioOverhead = 8000000;
            let loanRepaymentTotal = 0;
            state.activeLoans = state.activeLoans.filter(loan => {
                loanRepaymentTotal += loan.weeklyPayment;
                loan.weeksLeft -= 1;
                if (loan.weeksLeft <= 0) {
                    showToast('Pinjaman dari ' + loan.lender + ' telah LUNAS!', 'success');
                    return false;
                }
                return true;
            });
            state.cash -= (payroll + studioOverhead + loanRepaymentTotal);

            if (state.activeProduction) {
                state.activeProduction.takesLeftThisWeek = 2;
                if (state.activeProduction.progress < 100) {
                    state.activeProduction.progress = Math.min(100, state.activeProduction.progress + 10);
                    maybeTriggerOnSetIncident();
                }
            }

            if (state.week % 4 === 0) {
                state.trendingGenre = GENRES[Math.floor(Math.random() * GENRES.length)];
                const moods = [
                    { label: 'Pasar Lesu', mult: 0.78 },
                    { label: 'Pasar Normal', mult: 1.0 },
                    { label: 'Demam Bioskop', mult: 1.24 },
                    { label: 'Musim Liburan', mult: 1.38 }
                ];
                state.marketMood = moods[Math.floor(Math.random() * moods.length)];
            }

            let ourBoxOfficeCut = 0;
            state.releasedMovies.forEach(m => {
                if (!m.inTheater) return;
                m.theaterWeek = (m.theaterWeek || 1) + 1;

                if (m.theaterWeek > (m.maxTheaterWeeks || 4)) {
                    m.inTheater = false;
                    m.weeklyGross = 0;
                    m.screens = 0;
                    if (m.studio === state.studioName && !state.cineflix.licensedMovieIds.includes(m.id)) {
                        m.postTheaterReady = true;
                        state.cinemail.messages.unshift({
                            id: 'mail_pt_' + m.id + '_' + Date.now(),
                            folder: 'licensing',
                            sender: 'Distribusi Nasional & OTT',
                            email: 'distribution@nusantaracine.id',
                            subject: 'Turun Layar Bioskop: "' + m.title + '" Siap Masuk CineFlix+',
                            time: 'Pekan ' + state.week,
                            unread: true,
                            starred: false,
                            body: 'Masa tayang bioskop "' + m.title + '" (' + m.maxTheaterWeeks + ' pekan) telah selesai dengan total Box Office ' + formatIDR(m.totalGross) + '.\n\nBuka tab CineFlix+ untuk merilisnya ke katalog streaming dan menjaring pelanggan baru!',
                            actionType: 'none',
                            resolved: true
                        });
                    }
                    return;
                }

                const holdFactor = m.rating >= 4.2 ? 0.80 : m.rating >= 3.2 ? 0.65 : 0.44;
                m.weeklyGross = Math.round(m.weeklyGross * holdFactor * state.marketMood.mult);
                m.screens = Math.max(40, Math.round(m.screens * holdFactor));
                m.totalGross += m.weeklyGross;

                if (m.studio === state.studioName) {
                    ourBoxOfficeCut += Math.round(m.weeklyGross * 0.5);
                }
            });
            state.cash += ourBoxOfficeCut;

            const econ = calcCineflixWeeklyEconomics();
            if (econ.catalog.length > 0 && state.cineflix.subscribers > 0) {
                state.cash += econ.netWeekly;
                state.cineflix.weeksSinceNewCatalog += 1;
                if (state.cineflix.weeksSinceNewCatalog >= 3) {
                    const churnLoss = Math.round(state.cineflix.subscribers * 0.08);
                    state.cineflix.subscribers = Math.max(0, state.cineflix.subscribers - churnLoss);
                } else if (econ.avgRating >= 3.8) {
                    const organicGain = Math.round(econ.avgRating * 140);
                    state.cineflix.subscribers = Math.min(econ.tierCfg.maxSubs, state.cineflix.subscribers + organicGain);
                }
            }

            if (state.week % 2 === 0 || state.cash < 180000000) {
                generateSmartFundingMail(null);
            }

            const rivalCatalog = [
                { title: 'MALAM SATU SURO', studio: 'Rapi Films', director: 'Joko Anwar', genre: 'Horor', rating: 4.3, icon: 'ph-skull', grad: 'from-red-950 via-stone-950 to-black', synopsis: 'Ritual malam keramat membuka portal arwah leluhur di desa terpencil.' },
                { title: 'GARUDA TAKTIKAL', studio: 'Merantau Pictures', director: 'Timo Tjahjanto', genre: 'Aksi', rating: 4.5, icon: 'ph-fire', grad: 'from-orange-950 via-zinc-950 to-black', synopsis: 'Operasi penyelamatan sandera di pelabuhan peti kemas saat badai.' },
                { title: 'KOPI PAGI DI BANDUNG', studio: 'Miles Cinema', director: 'Riri Riza', genre: 'Romansa', rating: 4.0, icon: 'ph-heart', grad: 'from-rose-950 via-stone-950 to-black', synopsis: 'Dua barista beda prinsip bekerja sama menyelamatkan kedai kopi legendaris.' },
                { title: 'POCONG DISCO 3000', studio: 'Kaki Lima Pictures', director: 'Ujang Bensin', genre: 'Komedi', rating: 2.1, icon: 'ph-ghost', grad: 'from-lime-950 via-zinc-950 to-black', synopsis: 'Komedi horor dengan efek lampu disko yang bikin penonton pusing.' },
                { title: 'EKSODUS JAKARTA 2088', studio: 'Visinema Global', director: 'Angga Sasongko', genre: 'Sci-Fi', rating: 4.4, icon: 'ph-planet', grad: 'from-cyan-950 via-slate-950 to-black', synopsis: 'Misi evakuasi kota pesisir raksasa menjelang gelombang pasang abad ini.' },
                { title: 'JEJAK DI BALIK KABUT', studio: 'CJ ENM Asia', director: 'Na Hong-jin', genre: 'Thriller', rating: 4.6, icon: 'ph-detective', grad: 'from-indigo-950 via-zinc-950 to-black', synopsis: 'Penyelidikan kasus orang hilang di kota pegunungan mengungkap konspirasi tua.' },
                { title: 'KELUARGA CEMARA RAYA', studio: 'Imajinari Studio', director: 'Ernest Prakasa', genre: 'Drama', rating: 4.2, icon: 'ph-masks-theater', grad: 'from-amber-950 via-stone-950 to-black', synopsis: 'Reuni keluarga besar di hari raya membuka rahasia surat wasiat kakek.' },
                { title: 'PEDANG NAGA NUSANTARA', studio: 'Falcon Epic', director: 'Hanung Bramantyo', genre: 'Fantasi', rating: 4.1, icon: 'ph-sparkle', grad: 'from-teal-950 via-emerald-950 to-black', synopsis: 'Pendekar muda mencari pusaka penjaga keseimbangan alam di kepulauan timur.' },
                { title: 'TEROR KERETA TERAKHIR', studio: 'MD Horror Lab', director: 'Awi Suryadi', genre: 'Horor', rating: 3.9, icon: 'ph-skull', grad: 'from-red-950 via-zinc-950 to-black', synopsis: 'Penumpang kereta komuter tengah malam terjebak di stasiun yang tidak ada di peta.' },
                { title: 'OPERASI KILAT MERAH', studio: 'Screenplay Action', director: 'Gareth Evans', genre: 'Aksi', rating: 4.4, icon: 'ph-fire', grad: 'from-orange-950 via-stone-950 to-black', synopsis: 'Tim penyusup berpacu dengan waktu menggagalkan peretasan satelit nasional.' }
            ];

            const activeTheaterCount = state.releasedMovies.filter(m => m.inTheater).length;
            const releasesThisWeek = activeTheaterCount < 6 ? 2 : 1;

            for (let r = 0; r < releasesThisWeek; r++) {
                const idx = (state.week * 3 + r) % rivalCatalog.length;
                const cycle = Math.floor((state.week * 3 + r) / rivalCatalog.length);
                const pick = rivalCatalog[idx];
                const finalRivalTitle = cycle > 0 ? pick.title + ' ' + (cycle + 1) : pick.title;
                const rivalId = 'riv_' + state.week + '_' + r + '_' + Date.now();
                const trendBoost = pick.genre === state.trendingGenre ? 1.18 : 1.0;
                const rivalHype = Math.round(52 + pick.rating * 8);
                const rivalMaxWeeks = Math.max(4, Math.min(9, Math.round(rivalHype / 10)));
                const rivalScreens = Math.round((310 + pick.rating * 95) * trendBoost);
                const rivalGross = Math.round(rivalScreens * (105000 + pick.rating * 36000) * state.marketMood.mult);

                state.releasedMovies.unshift({
                    id: rivalId,
                    title: finalRivalTitle,
                    studio: pick.studio,
                    director: pick.director,
                    genre: pick.genre,
                    format: 'Film Panjang',
                    year: state.year,
                    rating: pick.rating,
                    inTheater: true,
                    theaterWeek: 1,
                    maxTheaterWeeks: rivalMaxWeeks,
                    weeklyGross: rivalGross,
                    totalGross: rivalGross,
                    screens: rivalScreens,
                    icon: pick.icon,
                    grad: pick.grad,
                    synopsis: pick.synopsis,
                    reviews: getInitialMovieReviews({ ...pick, title: finalRivalTitle })
                });

        // =========================================================================
        // 12. IPHONE-STYLE BOTTOM DOCK SWIPE GESTURES & INITIAL BOOT
        // =========================================================================
        let isDockHidden = false;

        function setBottomDockHidden(hidden) {
            isDockHidden = hidden;
            const dock = document.getElementById('bottomNavDock');
            const bar = document.getElementById('iphoneHomeBarZone');
            const main = document.getElementById('mainWorkspace');
            if (!dock || !bar || !main) return;

            dock.style.transform = '';
            dock.style.opacity = '';

            if (hidden) {
                dock.classList.add('dock-hidden');
                bar.classList.remove('bar-hidden');
                main.classList.remove('pb-20', 'sm:pb-20');
                main.classList.add('pb-6');
            } else {
                dock.classList.remove('dock-hidden');
                bar.classList.add('bar-hidden');
                main.classList.remove('pb-6');
                main.classList.add('pb-20', 'sm:pb-20');
            }
        }

        function initBottomDockGestures() {
            const dock = document.getElementById('bottomNavDock');
            const bar = document.getElementById('iphoneHomeBarZone');
            if (!dock || !bar) return;

            // 1. Swipe / Drag Down on Bottom Dock to Hide Completely
            let dockStartY = null;
            let dockDeltaY = 0;

            const onDockStart = (clientY) => {
                if (isDockHidden) return;
                dockStartY = clientY;
                dockDeltaY = 0;
                dock.classList.add('dock-dragging');
            };

            const onDockMove = (clientY) => {
                if (dockStartY === null || isDockHidden) return;
                dockDeltaY = Math.max(0, clientY - dockStartY);
                if (dockDeltaY > 4) {
                    dock.style.transform = `translate(-50%, ${dockDeltaY}px)`;
                    dock.style.opacity = String(Math.max(0.15, 1 - dockDeltaY / 110));
                }
            };

            const onDockEnd = () => {
                if (dockStartY === null) return;
                dock.classList.remove('dock-dragging');
                if (dockDeltaY > 24) {
                    playTone(390, 'sine', 0.06, 0.025);
                    setBottomDockHidden(true);
                } else {
                    dock.style.transform = '';
                    dock.style.opacity = '';
                }
                dockStartY = null;
                dockDeltaY = 0;
            };

            dock.addEventListener('touchstart', (e) => {
                if (e.touches[0]) onDockStart(e.touches[0].clientY);
            }, { passive: true });
            dock.addEventListener('touchmove', (e) => {
                if (e.touches[0]) onDockMove(e.touches[0].clientY);
            }, { passive: true });
            dock.addEventListener('touchend', onDockEnd);

            const handle = document.getElementById('dockSwipeHandle');
            if (handle) {
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    onDockStart(e.clientY);
                });
                handle.addEventListener('click', () => {
                    if (!isDockHidden && dockDeltaY <= 4) {
                        playTone(390, 'sine', 0.06, 0.025);
                        setBottomDockHidden(true);
                    }
                });
                window.addEventListener('mousemove', (e) => onDockMove(e.clientY));
                window.addEventListener('mouseup', onDockEnd);
            }

            // 2. Swipe / Drag Up (or Tap) on White iPhone Home Bar to Reveal Dock
            let barStartY = null;
            let barDeltaY = 0;

            const onBarStart = (clientY) => {
                if (!isDockHidden) return;
                barStartY = clientY;
                barDeltaY = 0;
            };

            const onBarMove = (clientY) => {
                if (barStartY === null || !isDockHidden) return;
                barDeltaY = barStartY - clientY;
            };

            const onBarEnd = () => {
                if (barStartY === null) return;
                if (barDeltaY > 18) {
                    playTone(540, 'sine', 0.07, 0.03);
                    setBottomDockHidden(false);
                }
                barStartY = null;
                barDeltaY = 0;
            };

            bar.addEventListener('touchstart', (e) => {
                if (e.touches[0]) onBarStart(e.touches[0].clientY);
            }, { passive: true });
            bar.addEventListener('touchmove', (e) => {
                if (e.touches[0]) onBarMove(e.touches[0].clientY);
            }, { passive: true });
            bar.addEventListener('touchend', onBarEnd);

            bar.addEventListener('mousedown', (e) => {
                e.preventDefault();
                onBarStart(e.clientY);
            });
            window.addEventListener('mousemove', (e) => onBarMove(e.clientY));
            window.addEventListener('mouseup', onBarEnd);

            bar.addEventListener('click', () => {
                if (isDockHidden) {
                    playTone(540, 'sine', 0.07, 0.03);
                    setBottomDockHidden(false);
                }
            });
        }

        const restored = loadGameState();
        initBottomDockGestures();
        updateHUD();
        switchMainTab(state.mainTab || 'studio');
        if (restored) {
