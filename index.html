        function playTone(freq = 520, type = 'sine', duration = 0.08, gainVal = 0.04) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function formatIDR(num) {
            const abs = Math.abs(num);
            const sign = num < 0 ? '-' : '';
            if (abs >= 1000000000) return sign + 'Rp ' + (abs / 1000000000).toFixed(2).replace(/\.00$/, '') + ' M';
            if (abs >= 1000000) return sign + 'Rp ' + Math.round(abs / 1000000) + ' Jt';
            if (abs >= 1000) return sign + 'Rp ' + Math.round(abs / 1000) + ' Rb';
            return sign + 'Rp ' + abs;
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

            const box = document.getElementById('toastContainer');
            if (!box) return;
            const styles = {
                info: 'bg-[#151b2b]/95 border-white/15 text-white',
                success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
                warn: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
                error: 'bg-rose-950/95 border-rose-500/40 text-rose-200'
            };
            const el = document.createElement('div');
            el.className = 'px-3.5 py-2.5 rounded-2xl border shadow-2xl backdrop-blur-md text-xs font-semibold flex items-center gap-2 animate-screen-push ' + (styles[type] || styles.info);
            el.innerHTML = '<i class="ph-fill ph-sparkle text-amber-400 shrink-0"></i><span class="leading-snug">' + msg + '</span>';
            box.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.25s ease';
                setTimeout(() => el.remove(), 260);
            }, 3200);
        }

        let state = createDefaultState();

        function saveGameState(silent = true) {
            try {
                state.lastSavedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                const icon = document.getElementById('hudSaveIcon');
                if (icon) {
                    icon.classList.remove('text-emerald-400');
                    icon.classList.add('text-amber-300');
                    setTimeout(() => {
                        icon.classList.remove('text-amber-300');
                        icon.classList.add('text-emerald-400');
                    }, 500);
                }
                if (!silent) showToast('Progres permainan tersimpan di browser!', 'success');
            } catch (e) {
                if (!silent) showToast('Gagal menyimpan ke LocalStorage browser.', 'error');
            }
        }

        function loadGameState() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return false;

                const fresh = createDefaultState();
                state = {
                    ...fresh,
                    ...parsed,
                    marketMood: { ...fresh.marketMood, ...(parsed.marketMood || {}) },
                    draft: { ...fresh.draft, ...(parsed.draft || {}) },
                    cinemail: {
                        ...fresh.cinemail,
                        ...(parsed.cinemail || {}),
                        mobilePane: 'list',

        function calcEstimatedProductionBudget() {
            const d = state.draft;
            const loc = LOCATIONS.find(l => l.id === d.locationId) || LOCATIONS[0];
            const formatBase = d.format === 'Film Panjang' ? 95000000 : d.format === 'Series' ? 80000000 : 30000000;
            const styleExtra = d.visualStyle === 'Animasi 3D' ? 55000000 : d.visualStyle === 'Animasi 2D' ? 30000000 : d.visualStyle === 'Stop-Motion' ? 25000000 : 0;
            return formatBase + loc.cost + styleExtra;
        }

        function calcDraftPreviewStats() {
            const d = state.draft;
            const loc = LOCATIONS.find(l => l.id === d.locationId) || LOCATIONS[0];
            const slotIds = [d.directorId, d.actorId, d.writerId, d.techId].filter(Boolean);
            let skillSum = 0;
            let matchedCount = 0;
            slotIds.forEach(cid => {
                const c = CREW_CATALOG.find(x => x.id === cid);
                if (c) {
                    skillSum += c.skill;
                    if (c.specialty === d.genre) matchedCount += 1;
                }
            });
            const avgSkill = slotIds.length > 0 ? skillSum / slotIds.length : 70;
            const totalPct = Math.max(1, d.scriptPct + d.prodPct + d.mktPct);
            const normScript = d.scriptPct / totalPct;
            const normProd = d.prodPct / totalPct;
            const normMkt = d.mktPct / totalPct;
            const ageQBonus = (d.ageRating === '17+' || d.ageRating === '21+') && ['Horor', 'Thriller', 'Drama'].includes(d.genre) ? 3 : 0;
            const ageHypeBonus = (d.ageRating === 'SU' || d.ageRating === '13+') ? 4 : 0;

            const estQuality = Math.min(92, Math.max(25, Math.round(avgSkill * 0.42 + loc.qBonus + matchedCount * 4 + ageQBonus + (normScript + normProd) * 28)));
            const estHype = Math.min(92, Math.max(15, Math.round(state.hype * 0.45 + loc.hypeBonus + ageHypeBonus + normMkt * 45 + (d.franchiseId ? 14 : 0))));
            return { estQuality, estHype, matchedCount, loc };
        }

        function resolveFlopCrisis(mode) {
            const m = state.releasedMovies.find(x => x.id === state.crisisMovieId);
            if (!m) {
                state.crisisMovieId = null;
                return renderPreProductionForm();
            }
            if (mode === 'meme') {
                state.hype = Math.min(100, state.hype + 10);
                m.rating = Math.min(5.0, Number((m.rating + 0.3).toFixed(1)));
                showToast('Kampanye meme viral! "' + m.title + '" berubah jadi cult-comedy (+10% Hype).', 'success');
            } else if (mode === 'apology') {
                if (state.cash < 20000000) return showToast('Kas tidak cukup (butuh Rp 20 Jt)!', 'error');
                state.cash -= 20000000;
                state.reputation = Math.min(100, state.reputation + 6);
                showToast('Konferensi pers diapresiasi publik (+6% Reputasi Studio).', 'success');
            } else if (mode === 'remaster') {
                if (state.cash < 35000000) return showToast('Kas tidak cukup (butuh Rp 35 Jt)!', 'error');
                state.cash -= 35000000;
                m.rating = Math.min(5.0, Number((m.rating + 0.5).toFixed(1)));
                state.reputation = Math.min(100, state.reputation + 4);
                showToast('Versi perbaikan dirilis! Skor "' + m.title + '" naik menjadi ' + m.rating.toFixed(1) + '★.', 'success');
            }
            state.crisisMovieId = null;
            saveGameState(true);
            updateHUD();
            renderPreProductionForm();
        }

        function randomizeProjectTitle() {
            const adj = ['BISIKAN', 'BAYANGAN', 'RAHASIA', 'MALAM', 'JEJAK', 'JANJI', 'GERBANG', 'SANDI', 'CAHAYA', 'LANGIT'];
            const noun = ['KERATON', 'JAKARTA', 'NUSANTARA', 'SENJA', 'KERETA', 'RIMBA', 'ORBIT', 'TERAKHIR', 'KELABU', 'MERAH'];
            state.draft.title = adj[Math.floor(Math.random() * adj.length)] + ' ' + noun[Math.floor(Math.random() * noun.length)];
            renderPreProductionForm();
        }

        function selectDraftGenre(g) {
            state.draft.genre = g;
            state.draft.synopsis = (STORY_PREMISES[g] || STORY_PREMISES['Horor'])[0];
            const matchDir = CREW_CATALOG.find(c => c.role === 'Sutradara' && c.specialty === g && state.hiredCrewIds.includes(c.id));
            const matchAct = CREW_CATALOG.find(c => c.role === 'Aktor' && c.specialty === g && state.hiredCrewIds.includes(c.id));
            const matchWrt = CREW_CATALOG.find(c => c.role === 'Penulis' && c.specialty === g && state.hiredCrewIds.includes(c.id));
            const matchTec = CREW_CATALOG.find(c => c.role === 'Teknis' && c.specialty === g && state.hiredCrewIds.includes(c.id));
            if (matchDir) state.draft.directorId = matchDir.id;
            if (matchAct) state.draft.actorId = matchAct.id;
            if (matchWrt) state.draft.writerId = matchWrt.id;
            if (matchTec) state.draft.techId = matchTec.id;
            renderPreProductionForm();
        }

        function applyStoryPremise(idx) {
            const list = STORY_PREMISES[state.draft.genre] || STORY_PREMISES['Horor'];
            state.draft.synopsis = list[idx] || list[0];
            renderPreProductionForm();
        }

        function assignPreProdCrew(slotKey, crewId) {
            state.draft[slotKey] = crewId;
            renderPreProductionForm();
        }

        function hireCrewMember(crewId, stayInPreProd = false) {
            const c = CREW_CATALOG.find(x => x.id === crewId);
            if (!c || state.hiredCrewIds.includes(crewId)) return;
            if (state.cash < c.signFee) return showToast('Kas studio tidak cukup untuk kontrak ' + c.name + '!', 'error');

            state.cash -= c.signFee;
            state.hiredCrewIds.push(crewId);
            saveGameState(true);
            playTone(620, 'triangle', 0.1, 0.04);
            updateHUD();
            showToast(c.name + ' (' + c.role + ' • ' + c.specialty + ') bergabung dengan studio!', 'success');
            if (stayInPreProd) renderPreProductionForm();
            else renderCrewRosterTab();
        }

        function releaseCrewMember(crewId) {
            if (state.hiredCrewIds.length <= 2) return showToast('Minimal pertahankan 2 anggota kru inti di studio!', 'warn');
            state.hiredCrewIds = state.hiredCrewIds.filter(id => id !== crewId);
            saveGameState(true);
            updateHUD();
            renderCrewRosterTab();
            showToast('Kontrak anggota kru diakhiri.', 'info');

        function startProduction() {
            const d = state.draft;
            if (!d.title.trim()) return showToast('Masukkan judul proyek terlebih dahulu!', 'warn');

            const slotIds = [d.directorId, d.actorId, d.writerId, d.techId].filter(Boolean);
            let extraSignFees = 0;
            slotIds.forEach(cid => {
                if (!state.hiredCrewIds.includes(cid)) {
                    const c = CREW_CATALOG.find(x => x.id === cid);
                    if (c) extraSignFees += c.signFee;
                }
            });

            const baseBudget = calcEstimatedProductionBudget();
            const totalInitialCost = baseBudget + extraSignFees;
            if (state.cash < totalInitialCost) {
                return showToast('Kas studio tidak cukup! Butuh ' + formatIDR(totalInitialCost) + ' (termasuk kontrak kru).', 'error');
            }

            state.cash -= totalInitialCost;
            slotIds.forEach(cid => {
                if (!state.hiredCrewIds.includes(cid)) state.hiredCrewIds.push(cid);
            });

            const preview = calcDraftPreviewStats();

            state.activeProduction = {
                title: d.title.trim().toUpperCase(),
                format: d.format,
                visualStyle: d.visualStyle,
                genre: d.genre,
                ageRating: d.ageRating || '17+',
                synopsis: d.synopsis.trim() || ('Produksi ' + d.genre + ' terbaru dari ' + state.studioName + '.'),
                locationName: preview.loc.name,
                budget: totalInitialCost,
                franchiseId: d.franchiseId,
                directorId: d.directorId,
                progress: 15,
                quality: preview.estQuality,
                hype: preview.estHype,
                takeStreak: 0,
                takesLeftThisWeek: 2,
                editingCut: 'theatrical',
                incident: null,
                audioPolished: false
            };

            saveGameState(true);
            playTone(580, 'triangle', 0.12, 0.05);

            const p = state.activeProduction;

        function resolveOnSetIncident(choiceIdx) {
            const p = state.activeProduction;
            if (!p || !p.incident) return;
            const ch = p.incident.choices[choiceIdx];
            if (!ch) return;
            if (ch.cost > 0 && state.cash < ch.cost) {
                return showToast('Kas studio tidak cukup (' + formatIDR(ch.cost) + ')!', 'error');
            }
            if (ch.cost > 0) {
                state.cash -= ch.cost;
                p.budget += ch.cost;
            }
            p.quality = Math.max(15, Math.min(100, p.quality + ch.q));
            p.hype = Math.max(10, Math.min(100, p.hype + ch.h));
            p.incident = null;
            saveGameState(true);
            playTone(640, 'triangle', 0.1, 0.04);
            updateHUD();
            renderActiveProduction();
            showToast('Keputusan lokasi diterapkan! (' + (ch.q >= 0 ? '+' : '') + ch.q + ' Q, +' + ch.h + ' Hype)', 'success');

        function triggerCameraTake() {
            const p = state.activeProduction;
            const cursor = document.getElementById('focusCursor');
            if (!p || !cursor) return;
            if (p.takesLeftThisWeek <= 0) {
                return showToast('Jatah 2x Take kamera pekan ini sudah habis! Klik Pekan +1 untuk melanjutkan syuting.', 'warn');
            }

            p.takesLeftThisWeek -= 1;
            const parentRect = cursor.parentElement.getBoundingClientRect();
            const cursorRect = cursor.getBoundingClientRect();
            const pct = ((cursorRect.left - parentRect.left) / parentRect.width) * 100;

            const isPerfect = pct >= 35 && pct <= 63;
            if (isPerfect) {
                p.takeStreak += 1;
                const qGain = Math.min(4, 1 + p.takeStreak);
                p.quality = Math.min(100, p.quality + qGain);
                p.progress = Math.min(100, p.progress + 18);
                playTone(760, 'triangle', 0.11, 0.05);
                showToast('PERFECT TAKE! Streak ' + p.takeStreak + 'x (+' + qGain + ' Kualitas, +18% Progres)!', 'success');
            } else {
                p.takeStreak = 0;
                p.quality = Math.min(100, p.quality + 1);
                p.progress = Math.min(100, p.progress + 10);
                playTone(460, 'sine', 0.08, 0.04);
                showToast('Take Melenceng! (+1 Kualitas, +10% Progres)', 'warn');
            }
            maybeTriggerOnSetIncident();
            saveGameState(true);
            renderActiveProduction();
        }

        function runOnSetAction(type) {
            const p = state.activeProduction;
            if (!p) return;
            if (type === 'promo') {
                if (state.cash < 25000000) return showToast('Kas tidak cukup (butuh Rp 25 Jt)!', 'error');
                state.cash -= 25000000;
                p.budget += 25000000;
                p.hype = Math.min(100, p.hype + 9);
                showToast('Teaser dirilis! Hype proyek naik +9%.', 'success');
            } else if (type === 'reshoot') {
                if (state.cash < 35000000) return showToast('Kas tidak cukup (butuh Rp 35 Jt)!', 'error');
                state.cash -= 35000000;
                p.budget += 35000000;
                p.quality = Math.min(100, p.quality + 7);
                showToast('Reshoot selesai! Kualitas produksi naik +7.', 'success');
            } else if (type === 'dolby') {
                if (p.audioPolished) return;
                if (state.cash < 20000000) return showToast('Kas tidak cukup (butuh Rp 20 Jt)!', 'error');
                state.cash -= 20000000;
                p.budget += 20000000;
                p.audioPolished = true;
                p.quality = Math.min(100, p.quality + 5);
                p.hype = Math.min(100, p.hype + 3);
                showToast('Tata suara Dolby Atmos & Color Grading selesai! (+5 Kualitas, +3 Hype)', 'success');
            }
            saveGameState(true);
            updateHUD();
            renderActiveProduction();
        }

            if (!p) return;
            if (state.cash < tier.fee) return showToast('Kas tidak cukup untuk biaya pendaftaran festival!', 'error');
            state.cash -= tier.fee;

            const cutBonus = p.editingCut === 'festival' ? 6 : 0;
            const effectiveQ = p.quality + cutBonus + (Math.random() * 10 - 4);
            const won = effectiveQ >= tier.minQ;

            closeModal();
            releaseActiveProduction('festival', { won, tier });
        }

        function releaseActiveProduction(channel, festResult = null) {
            const p = state.activeProduction;
            if (!p || p.progress < 100) return;

            const trendBonus = p.genre === state.trendingGenre ? 0.25 : 0;
            const cutRatingBonus = p.editingCut === 'directors' ? 0.2 : p.editingCut === 'festival' ? 0.15 : 0;
            const rawStars = 1.4 + (p.quality / 100) * 3.1 + trendBonus + cutRatingBonus + (festResult?.won ? 0.25 : 0);
            const finalRating = Math.min(5.0, Math.max(1.2, Number(rawStars.toFixed(1))));

            const dirObj = CREW_CATALOG.find(c => c.id === p.directorId);
            const directorName = dirObj ? dirObj.name : state.studioName;

            const genreVisuals = {
                Horor: { icon: 'ph-skull', grad: 'from-red-950 via-stone-950 to-black' },
                Aksi: { icon: 'ph-fire', grad: 'from-orange-950 via-zinc-950 to-black' },
                Drama: { icon: 'ph-masks-theater', grad: 'from-amber-950 via-stone-950 to-black' },
                Komedi: { icon: 'ph-smiley', grad: 'from-yellow-900 via-amber-950 to-black' },
                'Sci-Fi': { icon: 'ph-planet', grad: 'from-cyan-950 via-slate-950 to-black' },
                Thriller: { icon: 'ph-detective', grad: 'from-indigo-950 via-zinc-950 to-black' },
                Romansa: { icon: 'ph-heart', grad: 'from-rose-950 via-indigo-950 to-black' },
                Fantasi: { icon: 'ph-sparkle', grad: 'from-teal-950 via-emerald-950 to-black' }
            };
            const vis = genreVisuals[p.genre] || genreVisuals['Drama'];

            const isTheater = channel === 'theater' && p.format === 'Film Panjang';
            const theaterHype = Math.min(100, p.hype + (p.editingCut === 'theatrical' ? 6 : 0));
            const maxTheaterWeeks = isTheater ? Math.max(2, Math.min(10, Math.round(theaterHype / 10))) : 0;

            const initialScreens = isTheater
                ? Math.max(120, Math.min(950, Math.round((theaterHype * 5.2 + state.reputation * 3.1))))
                : 0;
            const openingGross = isTheater
                ? Math.round(initialScreens * (110000 + finalRating * 42000) * state.marketMood.mult)
                : 0;
            const studioOpeningShare = Math.round(openingGross * 0.5);
            if (isTheater) state.cash += studioOpeningShare;

            const newMovie = {
                id: 'mov_' + Date.now(),
                title: p.title,
                studio: state.studioName,
                director: directorName,
                genre: p.genre,
                format: p.format,
                year: state.year,
                rating: finalRating,
                inTheater: isTheater,
                theaterWeek: isTheater ? 1 : 0,
                maxTheaterWeeks,
                releaseHype: theaterHype,
                postTheaterReady: false,
                weeklyGross: openingGross,
                totalGross: openingGross,
                screens: initialScreens,
                icon: vis.icon,
                grad: vis.grad,
                synopsis: p.synopsis,
                reviews: generateReleaseReviews(p.title, p.genre, finalRating)
            };

            state.releasedMovies.unshift(newMovie);

            if (!isTheater) {
                if (!state.cineflix.licensedMovieIds.includes(newMovie.id)) {
                    state.cineflix.licensedMovieIds.unshift(newMovie.id);
                    state.cineflix.weeksSinceNewCatalog = 0;
                }
                const tierCaps = { 1: 25000, 2: 80000, 3: 250000 };
                const cap = tierCaps[state.cineflix.tier] || 25000;
                const subGain = Math.round((finalRating * 950 + p.hype * 45) * (p.format === 'Series' ? 1.35 : 1.0));
                state.cineflix.subscribers = Math.min(cap, state.cineflix.subscribers + subGain);
            }

            if (p.franchiseId) {
                const fr = state.franchises.find(x => x.id === p.franchiseId);
                if (fr) {
                    fr.entries += 1;
                    fr.bestRating = Math.max(fr.bestRating, finalRating);
                }
            } else if (finalRating >= 3.8) {
                state.franchises.unshift({
                    id: 'ip_' + Date.now(),
                    name: p.title,
                    genre: p.genre,
                    entries: 1,
                    bestRating: finalRating
                });
            }

            const repDelta = finalRating >= 4.0 ? 5 : finalRating >= 3.0 ? 2 : -4;
            state.reputation = Math.max(5, Math.min(100, state.reputation + repDelta));
            state.hype = Math.max(15, Math.min(100, Math.round((state.hype + p.hype) * 0.45)));

            state.cinegram.posts.unshift({
                id: 'post_rel_' + Date.now(),
                region: 'id',
                author: 'cinephile_jakarta',
                verified: true,
                following: true,
                location: isTheater ? 'Jaringan Bioskop Nasional' : 'CineFlix+ Original Premiere',
                time: 'Baru saja',
                headline: (isTheater ? 'TAYANG PERDANA: ' : 'PREMIERE STREAMING: ') + p.title,
                grad: vis.grad,
                icon: vis.icon,
                movieId: newMovie.id,
                caption: state.studioName + ' resmi merilis ' + p.format + ' "' + p.title + '" (' + finalRating.toFixed(1) + '★)! ' + (isTheater ? 'Dijadwalkan tayang ' + maxTheaterWeeks + ' pekan di bioskop sesuai antusiasme penonton! 🎟️🍿' : 'Kini eksklusif tayang di CineFlix+! 📺🔥') + ' #FilmIndonesia',
                translatedCaption: null,
                likes: Math.round(1400 + finalRating * 750),
                liked: false,
                bookmarked: false,
                poll: null,
                comments: [
                    { id: 'cr1_' + Date.now(), user: 'nadia_sinefil', text: finalRating >= 3.8 ? 'Baru kelar nonton dan gila sih eksekusinya rapi banget!! 🔥👏' : 'Premisnya unik sih, lumayan buat tontonan akhir pekan.', time: '1m', likes: 94, liked: false },
                    { id: 'cr2_' + Date.now(), user: 'dimas.projector', text: 'Arahan ' + directorName + ' kerasa banget ciri khasnya di sini.', time: '1m', likes: 62, liked: false },
                    { id: 'cr3_' + Date.now(), user: 'tukang_popcorn', text: '@rara.movietalk gas nonton ini malem ini!', time: '1m', likes: 38, liked: false }
                ],
                hiddenComments: []
            });
            state.cinegram.unreadNotif = true;

            if (finalRating <= 2.5) {
                state.crisisMovieId = newMovie.id;
            } else if (finalRating >= 3.7 && (!isTheater || openingGross < 180000000 || state.cash < 250000000)) {
                generateSmartFundingMail(newMovie);
            }

            state.activeProduction = null;
            saveGameState(true);
            updateHUD();
            renderStudioView();

            if (festResult) {
                if (festResult.won) {
                    triggerAwardWin({
                        festival: festResult.tier.name,
                        category: festResult.tier.cat,
                        movieTitle: p.title,
                        prizeCash: festResult.tier.prize,
                        repGain: festResult.tier.rep
                    });
                } else {
                    showToast('"' + p.title + '" tampil di ' + festResult.tier.name + ' (belum menang piala) & masuk ke CineFlix+.', 'info');
                }
            } else if (isTheater) {
                showToast('"' + p.title + '" rilis di bioskop (' + maxTheaterWeeks + ' mgg)! Bagian pembuka: +' + formatIDR(studioOpeningShare), 'success');
            } else {
                showToast('"' + p.title + '" tayang eksklusif di CineFlix+ (' + finalRating.toFixed(1) + '★)!', 'success');
            }
        }

        function getSenderAvatarStyle(sender) {
            const palettes = [
                'from-rose-500 to-pink-600',
                'from-sky-500 to-indigo-600',
                'from-amber-500 to-orange-600',
                'from-emerald-500 to-teal-600',
                'from-purple-500 to-fuchsia-600'
            ];
            let hash = 0;
            for (let i = 0; i < sender.length; i++) hash = sender.charCodeAt(i) + ((hash << 5) - hash);
            const grad = palettes[Math.abs(hash) % palettes.length];
            const initials = sender.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'CM';
            return { grad, initials };
        }

        function openCinemailThread(mailId) {
            state.cinemail.selectedId = mailId;
            state.cinemail.mobilePane = 'detail';

            if (m && m.unread) {
                m.unread = false;
                updateHUD();
            }
            renderCinemailView();
        }

        function markAllMailsRead() {
            state.cinemail.messages.forEach(m => m.unread = false);
            updateHUD();
            renderCinemailView();
            showToast('Semua pesan ditandai sudah dibaca.', 'info');
        }

        function deleteCinemailThread(mailId) {
            state.cinemail.messages = state.cinemail.messages.filter(m => m.id !== mailId);
            state.cinemail.mobilePane = 'list';
            saveGameState(true);
            updateHUD();
            renderCinemailView();
            showToast('Pesan dihapus dari kotak masuk.', 'info');
        }

        function toggleMailStar(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (m) {
                m.starred = !m.starred;
                renderCinemailView();
            }
        }

        function negotiateLicenseMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.negotiated) return;
            m.negotiated = true;
            if (Math.random() < 0.72) {
                m.price = Math.round(m.price * 0.85);
                showToast('Negosiasi berhasil! Harga lisensi turun 15% menjadi ' + formatIDR(m.price) + '.', 'success');
            } else {
                showToast('Studio pemilik hak cipta menolak diskon dan bertahan di harga awal.', 'warn');
            }
            saveGameState(true);
            renderCinemailView();
        }

        function acceptLicenseMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            if (state.cash < m.price) return showToast('Kas studio tidak cukup untuk membeli lisensi ini!', 'error');

            state.cash -= m.price;
            m.resolved = true;
            if (!state.cineflix.licensedMovieIds.includes(m.movieId)) {
                state.cineflix.licensedMovieIds.unshift(m.movieId);
                state.cineflix.weeksSinceNewCatalog = 0;
            }
            const tierCaps = { 1: 25000, 2: 80000, 3: 250000 };
            const cap = tierCaps[state.cineflix.tier] || 25000;
            state.cineflix.subscribers = Math.min(cap, state.cineflix.subscribers + m.subBoost);

            saveGameState(true);
            playTone(640, 'triangle', 0.12, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Lisensi resmi aktif di CineFlix+! Pelanggan bertambah.', 'success');
        }

        function acceptSponsorMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.payout;
            m.resolved = true;
            saveGameState(true);
            playTone(680, 'triangle', 0.1, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Dana sponsor +' + formatIDR(m.payout) + ' masuk ke kas studio!', 'success');
        }

        function acceptLoanMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.principal;
            m.resolved = true;
            state.activeLoans.push({
                id: 'loan_' + Date.now(),
                lender: m.sender,
                principal: m.principal,
                weeklyPayment: m.weeklyPayment,
                weeksLeft: m.durationWeeks
            });
            saveGameState(true);
            playTone(620, 'triangle', 0.12, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Pinjaman +' + formatIDR(m.principal) + ' cair! Cicilan ' + formatIDR(m.weeklyPayment) + '/mgg.', 'success');
        }

        function acceptCoProdMail(mailId) {
            const m = state.cinemail.messages.find(x => x.id === mailId);
            if (!m || m.resolved) return;
            state.cash += m.payout;
            state.reputation = Math.min(100, state.reputation + (m.repGain || 3));
            m.resolved = true;
            saveGameState(true);
            playTone(720, 'triangle', 0.14, 0.05);
            updateHUD();
            renderCinemailView();
            showToast('Investasi Co-Production +' + formatIDR(m.payout) + ' & +' + (m.repGain || 3) + '% Reputasi diterima!', 'success');
        }

        function repayLoanEarly(loanId) {
            const idx = state.activeLoans.findIndex(l => l.id === loanId);
            if (idx === -1) return;
            const loan = state.activeLoans[idx];
            const payoff = loan.weeklyPayment * loan.weeksLeft;
            if (state.cash < payoff) return showToast('Kas studio tidak cukup untuk pelunasan (' + formatIDR(payoff) + ')!', 'error');
            state.cash -= payoff;
            state.activeLoans.splice(idx, 1);
            saveGameState(true);
            playTone(740, 'triangle', 0.12, 0.05);
            updateHUD();
            openFundingPitchModal();
            showToast('Pinjaman dari ' + loan.lender + ' berhasil dilunasi!', 'success');
        }

            if (kind === 'copro') {
                const best = state.releasedMovies

                    .sort((a, b) => b.rating - a.rating)[0];
                if (!best) {
                    return showToast('Rilis minimal 1 karya studio dengan skor ≥ 3.6★ terlebih dahulu untuk pitching ke perusahaan film!', 'warn');

                state.cinemail.messages.unshift({

                    principal,

        function calcCineflixWeeklyEconomics() {
            const cf = state.cineflix;
            const tierCfg = CINEFLIX_TIERS[cf.tier] || CINEFLIX_TIERS[1];
            const catalog = state.releasedMovies.filter(m => cf.licensedMovieIds.includes(m.id));
            if (catalog.length === 0 || cf.subscribers <= 0) {
                return { catalog, tierCfg, grossWeekly: 0, platformFee: 0, serverCost: 0, netWeekly: 0, avgRating: 0 };
            }
            const avgRating = catalog.reduce((s, m) => s + m.rating, 0) / catalog.length;
            const grossWeekly = Math.round((cf.subscribers * cf.monthlyPrice) / 4);
            const platformFee = Math.round(grossWeekly * 0.15);
            const serverCost = Math.round(cf.subscribers * tierCfg.serverCostPerSub);
            const netWeekly = grossWeekly - platformFee - serverCost;
            return { catalog, tierCfg, grossWeekly, platformFee, serverCost, netWeekly, avgRating };
        }

        function buildRatingHistogram(movie) {
            const centerBin = Math.max(0, Math.min(9, Math.round(movie.rating * 2) - 1));
            const bins = [];
            for (let i = 0; i < 10; i++) {
                const dist = Math.abs(i - centerBin);
                const base = dist === 0 ? 100 : dist === 1 ? 64 : dist === 2 ? 32 : dist === 3 ? 14 : 5;
                bins.push(base);
            }
            (movie.reviews || []).forEach(r => {
                const idx = Math.max(0, Math.min(9, Math.round(r.rating * 2) - 1));
                bins[idx] += 18;
            });
            const maxVal = Math.max(...bins, 1);
            return bins.map(v => Math.max(10, Math.round((v / maxVal) * 100)));
        }

        // =========================================================================
        // 11. WEEKLY SIMULATION ENGINE (PEKAN +1 + AUTO-SAVE TO LOCALSTORAGE)
        // =========================================================================
        function advanceWeek() {
            state.week += 1;
            if (state.week > 52) {
                state.week = 1;
                state.year += 1;
            }

            // 1. Studio Overhead & Crew Payroll
            const payroll = getWeeklyPayroll();
            const studioOverhead = 8000000;
            let loanRepaymentTotal = 0;
            state.activeLoans = state.activeLoans.filter(loan => {
                loanRepaymentTotal += loan.weeklyPayment;
                loan.weeksLeft -= 1;
                if (loan.weeksLeft <= 0) {
                    showToast('Pinjaman dari ' + loan.lender + ' telah LUNAS!', 'success');
                    return false;
                }
                return true;
            });
            state.cash -= (payroll + studioOverhead + loanRepaymentTotal);

            // 1b. Reset weekly camera takes & progress active on-set filming
            if (state.activeProduction) {
                state.activeProduction.takesLeftThisWeek = 2;
                if (state.activeProduction.progress < 100) {
                    state.activeProduction.progress = Math.min(100, state.activeProduction.progress + 10);
                    maybeTriggerOnSetIncident();
                }
            }

            // 2. Update Trending Genre & Market Mood periodically
            if (state.week % 4 === 0) {
                state.trendingGenre = GENRES[Math.floor(Math.random() * GENRES.length)];
                const moods = [
                    { label: 'Pasar Lesu', mult: 0.78 },
                    { label: 'Pasar Normal', mult: 1.0 },
                    { label: 'Demam Bioskop', mult: 1.24 },
                    { label: 'Musim Liburan', mult: 1.38 }
                ];
                state.marketMood = moods[Math.floor(Math.random() * moods.length)];
            }

            // 3. Theatrical Box Office Simulation
            let ourBoxOfficeCut = 0;
            state.releasedMovies.forEach(m => {
                if (!m.inTheater) return;
                m.theaterWeek = (m.theaterWeek || 1) + 1;

                if (m.theaterWeek > (m.maxTheaterWeeks || 4)) {
                    m.inTheater = false;
                    m.weeklyGross = 0;
                    m.screens = 0;
                    if (m.studio === state.studioName && !state.cineflix.licensedMovieIds.includes(m.id)) {
                        m.postTheaterReady = true;
                        state.cinemail.messages.unshift({
                            id: 'mail_pt_' + m.id + '_' + Date.now(),
                            folder: 'licensing',
                            sender: 'Distribusi Nasional & OTT',
                            email: 'distribution@nusantaracine.id',
                            subject: 'Turun Layar Bioskop: "' + m.title + '" Siap Masuk CineFlix+',
                            time: 'Pekan ' + state.week,
                            unread: true,
                            starred: false,
                            body: 'Masa tayang bioskop "' + m.title + '" (' + m.maxTheaterWeeks + ' pekan) telah selesai dengan total Box Office ' + formatIDR(m.totalGross) + '.\n\nBuka tab CineFlix+ untuk merilisnya ke katalog streaming dan menjaring pelanggan baru!',
                            actionType: 'none',
                            resolved: true
                        });
                    }
                    return;
                }

                const holdFactor = m.rating >= 4.2 ? 0.80 : m.rating >= 3.2 ? 0.65 : 0.44;
                m.weeklyGross = Math.round(m.weeklyGross * holdFactor * state.marketMood.mult);
                m.screens = Math.max(40, Math.round(m.screens * holdFactor));
                m.totalGross += m.weeklyGross;

                if (m.studio === state.studioName) {
                    ourBoxOfficeCut += Math.round(m.weeklyGross * 0.5);
                }
            });
            state.cash += ourBoxOfficeCut;

            // 4. CineFlix+ Streaming Weekly Profit & Subscriber Churn
            const econ = calcCineflixWeeklyEconomics();
            if (econ.catalog.length > 0 && state.cineflix.subscribers > 0) {
                state.cash += econ.netWeekly;
                state.cineflix.weeksSinceNewCatalog += 1;
                if (state.cineflix.weeksSinceNewCatalog >= 3) {
                    const churnLoss = Math.round(state.cineflix.subscribers * 0.08);
                    state.cineflix.subscribers = Math.max(0, state.cineflix.subscribers - churnLoss);
                } else if (econ.avgRating >= 3.8) {
                    const organicGain = Math.round(econ.avgRating * 140);
                    state.cineflix.subscribers = Math.min(econ.tierCfg.maxSubs, state.cineflix.subscribers + organicGain);
                }
            }

            // 5. Rival AI Studio Release & Licensing Offer every 3 weeks
            if (state.week % 2 === 0 || state.cash < 180000000) {
                generateSmartFundingMail(null);
            }

            if (state.week % 3 === 0) {
                const rivalTitles = [
                    { title: 'MALAM SATU SURO', studio: 'Rapi Films', director: 'Joko Anwar', genre: 'Horor', rating: 4.3, icon: 'ph-skull', grad: 'from-red-950 via-stone-950 to-black', synopsis: 'Ritual malam keramat membuka portal arwah leluhur di desa terpencil.' },
                    { title: 'GARUDA TAKTIKAL', studio: 'Merantau Pictures', director: 'Timo Tjahjanto', genre: 'Aksi', rating: 4.5, icon: 'ph-fire', grad: 'from-orange-950 via-zinc-950 to-black', synopsis: 'Operasi penyelamatan sandera di pelabuhan peti kemas saat badai.' },
                    { title: 'KOPI PAGI DI BANDUNG', studio: 'Miles Cinema', director: 'Riri Riza', genre: 'Romansa', rating: 4.0, icon: 'ph-heart', grad: 'from-rose-950 via-stone-950 to-black', synopsis: 'Dua barista beda prinsip bekerja sama menyelamatkan kedai kopi legendaris.' },
                    { title: 'POCONG DISCO 3000', studio: 'Kaki Lima Pictures', director: 'Ujang Bensin', genre: 'Komedi', rating: 1.8, icon: 'ph-ghost', grad: 'from-lime-950 via-zinc-950 to-black', synopsis: 'Komedi horor dengan efek lampu disko yang bikin penonton pusing.' }
                ];
                const pick = rivalTitles[(state.week / 3) % rivalTitles.length];
                const rivalId = 'riv_' + state.week + '_' + Date.now();
                const rivalHype = Math.round(50 + pick.rating * 8);
                const rivalMaxWeeks = Math.max(2, Math.min(9, Math.round(rivalHype / 10)));
                const rivalScreens = Math.round(280 + pick.rating * 95);
                const rivalGross = Math.round(rivalScreens * (95000 + pick.rating * 35000));

                state.releasedMovies.unshift({
                    id: rivalId,
                    title: pick.title,
                    studio: pick.studio,
                    director: pick.director,
                    genre: pick.genre,
                    format: 'Film Panjang',
                    year: state.year,
                    rating: pick.rating,
                    inTheater: true,
                    theaterWeek: 1,
                    maxTheaterWeeks: rivalMaxWeeks,
                    weeklyGross: rivalGross,
                    totalGross: rivalGross,
                    screens: rivalScreens,
                    icon: pick.icon,
                    grad: pick.grad,
                    synopsis: pick.synopsis,
                    reviews: getInitialMovieReviews(pick)
                });

                const offerPrice = Math.round(65000000 + pick.rating * 18000000);
                state.cinemail.messages.unshift({
                    id: 'mail_lic_' + Date.now(),
                    folder: 'licensing',
                    sender: pick.studio + ' Distribution',
                    email: 'sales@' + pick.studio.toLowerCase().replace(/\s+/g, '') + '.id',
                    subject: 'Penawaran Hak Tayang CineFlix+: ' + pick.title + ' (' + pick.rating.toFixed(1) + '★)',
                    time: 'Pekan ' + state.week,
                    unread: true,
                    starred: false,
                    body: 'Halo Tim CineFlix+,\n\nKami menawarkan lisensi tayang streaming untuk "' + pick.title + '" (' + pick.genre + ', ' + pick.rating.toFixed(1) + '★). Tambah judul ini untuk meningkatkan retensi pelanggan Anda!',
                    actionType: 'license_offer',
                    movieId: rivalId,
                    price: offerPrice,
                    subBoost: Math.round(2500 + pick.rating * 1200),
                    negotiated: false,
                    resolved: false
                });
            }

            // 6. Procedural Weekly CineGram News
            const weeklyGramPool = [
                {
                    region: 'id',
                    author: 'receh_bioskop',
                    verified: false,
                    location: 'XXI Blok M Square',
                    headline: 'PENONTON BAWA RICE COOKER KE STUDIO PREMIERE?! 🍚💀',
                    grad: 'from-amber-950 via-zinc-950 to-black',
                    icon: 'ph-smiley',
                    caption: 'Gak ngerti lagi sama kelakuan warga +62 pas nonton midnight show pekan ini. Beneran bawa nasi anget sama lauk dari rumah demi hemat paket combo 😂🍿 #FilmIndonesia #BioskopID',
                    translatedCaption: null,
                    comments: [
                        { id: 'wg1_' + Date.now(), user: 'tukang_popcorn', text: 'Ini mah bukan nonton bioskop, tapi piknik kelurahan 😭🤣', time: 'Baru saja', likes: 312, liked: false },
                        { id: 'wg2_' + Date.now(), user: 'dinda_kurnia', text: 'WKWKWK satpamnya pasti bingung mau negur apa minta sepiring', time: 'Baru saja', likes: 198, liked: false },
                        { id: 'wg3_' + Date.now(), user: 'nonton_hemat', text: 'Definisi menikmati sinema dengan kearifan lokal 🙏', time: 'Baru saja', likes: 144, liked: false },
                        { id: 'wg4_' + Date.now(), user: 'rara.movietalk', text: '@bagas_pratama ide bagus buat weekend depan bro', time: 'Baru saja', likes: 67, liked: false }
                    ]
                },
                {
                    region: 'intl',
                    author: 'variety_asia',
                    verified: true,
                    location: 'Tokyo & Seoul Film Market',
                    headline: 'GLOBAL STREAMERS HUNTING ASIAN GENRE FILMS!',
                    grad: 'from-indigo-950 via-slate-950 to-black',
                    icon: 'ph-globe-hemisphere-east',
                    caption: 'International OTT platforms report a 42% surge in viewership for Southeast Asian ' + state.trendingGenre + ' titles this month. Independent studios are entering a golden era! 🎬🌏 #GlobalCinema',
                    translatedCaption: 'Platform OTT internasional melaporkan lonjakan penonton 42% untuk judul ' + state.trendingGenre + ' Asia Tenggara bulan ini. Studio independen memasuki era keemasan! 🎬🌏',
                    showTranslation: false,
                    comments: [
                        { id: 'wg5_' + Date.now(), user: 'kenji_tokyo', text: '東南アジアの映画は今本当に勢いがありますね！🔥', time: 'Baru saja', likes: 176, liked: false },
                        { id: 'wg6_' + Date.now(), user: 'minji_seoul', text: '요즘 아시아 장르 영화 퀄리티가 대박이에요 👏🎬', time: 'Baru saja', likes: 152, liked: false },
                        { id: 'wg7_' + Date.now(), user: 'cinephile_jakarta', text: 'Saatnya studio lokal naik kelas dan ekspor karya ke pasar global!', time: 'Baru saja', likes: 204, liked: false }
                    ]
                },
                {
                    region: 'id',
                    author: 'cinephile_jakarta',
                    verified: true,
                    location: 'Jakarta Film Week',
                    headline: 'TREN GENRE ' + state.trendingGenre.toUpperCase() + ' SEDANG NAIK DAUN!',
                    grad: 'from-emerald-950 via-stone-950 to-black',
                    icon: 'ph-trend-up',
                    caption: 'Data penonton pekan ' + state.week + ' menunjukkan film bergenre ' + state.trendingGenre + ' mencatat okupansi kursi tertinggi di jaringan bioskop nasional! Studio mana yang siap panen? 📈🍿 #BoxOfficeID',
                    translatedCaption: null,
                    comments: [
                        { id: 'wg8_' + Date.now(), user: 'dimas.projector', text: 'Penonton lagi haus cerita ' + state.trendingGenre + ' yang fresh dan gak klise!', time: 'Baru saja', likes: 118, liked: false },
                        { id: 'wg9_' + Date.now(), user: 'nadia_sinefil', text: 'Semoga kualitas penulisan naskahnya ikut dijaga biar gak asal ikut tren.', time: 'Baru saja', likes: 94, liked: false },
                        { id: 'wg10_' + Date.now(), user: 'sinema_nusantara', text: 'Ditunggu kejutan dari ' + state.studioName + ' tahun ini! 👀🎬', time: 'Baru saja', likes: 81, liked: false }
                    ]
                }
            ];
            const pickedPost = weeklyGramPool[state.week % weeklyGramPool.length];
            state.cinegram.posts.unshift({
                id: 'post_wk_' + state.week + '_' + Date.now(),
                region: pickedPost.region,
                author: pickedPost.author,
                verified: pickedPost.verified,
                following: true,
                location: pickedPost.location,
                time: 'Pekan ' + state.week,
                headline: pickedPost.headline,
                grad: pickedPost.grad,
                icon: pickedPost.icon,
                movieId: null,
                caption: pickedPost.caption,
                translatedCaption: pickedPost.translatedCaption,
                showTranslation: false,
                likes: Math.round(1800 + Math.random() * 4200),
                liked: false,
                bookmarked: false,
                poll: null,
                comments: pickedPost.comments,
                hiddenComments: []
            });
            state.cinegram.unreadNotif = true;

            // 7. Annual Industry Awards on Week 52
            if (state.week === 52) {
                const ourTop = state.releasedMovies
                    .filter(m => m.studio === state.studioName && m.year === state.year && m.rating >= 4.2)
                    .sort((a, b) => b.rating - a.rating)[0];
                if (ourTop) {
                    triggerAwardWin({
                        festival: 'Anugerah Sinema Nasional ' + state.year,
                        category: 'Karya Terbaik Tahun Ini',
                        movieTitle: ourTop.title,
                        prizeCash: 150000000,
                        repGain: 12
                    });
                }
            }

            // 8. Auto-save full state to LocalStorage
            saveGameState(true);

            playTone(500, 'sine', 0.08, 0.03);
            updateHUD();
            renderCurrentTab();

            const netDelta = ourBoxOfficeCut + (econ.catalog.length > 0 ? econ.netWeekly : 0) - (payroll + studioOverhead + loanRepaymentTotal);
            showToast('Pekan ' + state.week + ' • Arus kas bersih: ' + (netDelta >= 0 ? '+' : '') + formatIDR(netDelta), netDelta >= 0 ? 'success' : 'info');
        }

        // =========================================================================
        // 12. INITIAL BOOT (LOAD SAVED DATA IF AVAILABLE)
        // =========================================================================
        const restored = loadGameState();
        updateHUD();
        switchMainTab(state.mainTab || 'studio');
        if (restored) {
            setTimeout(() => showToast('Progres tersimpan dimuat kembali (Pekan ' + state.week + ')!', 'success'), 350);
        } else {
            saveGameState(true);
        }
    </script>
</body>
